name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unpinned on purpose. This job exists to prove the ranges in pyproject.toml still
  # resolve on every Python we claim to support. The pinned job below is the other half.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Format
        run: python -m ruff format --check src tests

      - name: Typecheck
        run: python -m mypy

      # Every test is offline: the Yahoo client runs against recorded JSON fixtures and
      # everything else against seeded random walks. A green run here means nothing in
      # the suite quietly depends on a vendor being up.
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing

  # The reproducible path: the exact versions the checked-in reports were produced with.
  # If a pin is yanked or the file goes stale, this fails and the matrix above does not,
  # which is the point of keeping them apart.
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the pinned set
        run: python -m pip install -c constraints.txt -e ".[dev]"

      - name: Test
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t xsbt:ci .

      - name: Smoke test the entrypoint
        run: docker run --rm xsbt:ci --version
